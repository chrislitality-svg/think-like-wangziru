<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="32 条视频逐字转写，72 段回答逐段编码，13 个做法附原话，14 个示例">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#1b1640"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="150" rx="24" fill="url(#bg)"/>
  <g font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <text x="150" y="76" font-size="52" font-weight="800" fill="url(#acc)">32</text>
    <text x="150" y="112" font-size="18" fill="#cbd5e1">条视频逐字转写</text>
    <text x="450" y="76" font-size="52" font-weight="800" fill="url(#acc)">72</text>
    <text x="450" y="112" font-size="18" fill="#cbd5e1">段直播回答逐段编码</text>
    <text x="750" y="76" font-size="52" font-weight="800" fill="url(#acc)">13</text>
    <text x="750" y="112" font-size="18" fill="#cbd5e1">个做法，每条附原话和时间点</text>
    <text x="1050" y="76" font-size="52" font-weight="800" fill="url(#acc)">14</text>
    <text x="1050" y="112" font-size="18" fill="#cbd5e1">个示例，打开就能看</text>
  </g>
  <g stroke="#334155" stroke-width="2">
    <line x1="300" y1="36" x2="300" y2="116"/>
    <line x1="600" y1="36" x2="600" y2="116"/>
    <line x1="900" y1="36" x2="900" y2="116"/>
  </g>
</svg>
