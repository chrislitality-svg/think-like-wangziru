name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile tools & scripts (syntax check)
        run: python -m py_compile tools/*.py research/scripts/*.py

      - name: Detector on scripted video (official channel)
        run: python tools/ai_flavor_check.py "corpus/official/2026-10-10-华为PuraXView胖直板-22m51s.txt" --json

      - name: Detector on improvised clip (JACHZHU)
        run: python tools/ai_flavor_check.py "corpus/clips-jachzhu/2026-09-22-聊西贝事件的根源-1m11s.txt" --json

      - name: Regression guard — real speech must stay under the AI-flavor threshold (< 20)
        run: |
          python tools/ai_flavor_check.py "corpus/clips-jachzhu/2026-09-22-聊西贝事件的根源-1m11s.txt" --json \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['score'] < 20, f\"expected <20, got {d['score']}\""
